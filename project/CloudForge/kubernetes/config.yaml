apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  postgres-init.sql: |
    CREATE TABLE IF NOT EXISTS deployments (
        id SERIAL PRIMARY KEY,
        application VARCHAR(100),
        environment VARCHAR(50),
        status VARCHAR(50)
    );

    INSERT INTO deployments (application, environment, status)
    VALUES ('CloudForge', 'Dev', 'Running');
